<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060a" />
<title>HeroCard — Coleccionables Deportivos</title>

<!-- html2canvas desde CDN para exportar la carta como imagen PNG -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- Tipografías: Montserrat (todo) + Oswald (números enormes de impacto) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   HeroCard v3 · Design Tokens
   ========================================================= */
:root {
  --bg-0: #05060a;
  --ink: #f4f6ff;
  --ink-dim: #8a90ad;
  --line: rgba(255,255,255,.08);

  /* Color del tipo activo (JS lo cambia según deporte) */
  --type: #ff4d2e;
  --type-dark: #8a1a0a;
  --type-soft: rgba(255,77,46,.35);

  /* Marco dorado */
  --gold-1: #f8e199;
  --gold-2: #c48e2b;
  --gold-3: #7a4d15;

  /* Carta con ratio 9:16 (Stories-ready) */
  --card-w: min(88vw, 360px);
  --card-h: calc(var(--card-w) * 16 / 9);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(177,75,255,.15), transparent 60%),
    radial-gradient(900px 500px at 90% 10%, rgba(0,224,255,.12), transparent 60%),
    radial-gradient(800px 500px at 50% 120%, rgba(255,176,32,.10), transparent 60%),
    var(--bg-0);
  color: var(--ink);
  font-family: 'Montserrat', system-ui, sans-serif;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

body::before {
  content: "";
  position: fixed; inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: .06;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.9'/></svg>");
}

.app {
  position: relative;
  z-index: 2;
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 20px 120px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  align-items: center;
}

/* =========================================================
   Header
   ========================================================= */
header.brand {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}
.logo {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  letter-spacing: -.01em;
  font-size: 20px;
  text-transform: uppercase;
}
.logo span {
  color: var(--gold-1);
  text-shadow: 0 0 12px rgba(248,225,153,.4);
}
.tag {
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink-dim);
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
}

/* =========================================================
   Form
   ========================================================= */
.form-wrap {
  width: 100%;
  max-width: 520px;
  backdrop-filter: blur(14px) saturate(130%);
  -webkit-backdrop-filter: blur(14px) saturate(130%);
  background: linear-gradient(180deg, rgba(20,22,36,.7), rgba(10,12,20,.55));
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px 22px 18px;
  box-shadow: 0 40px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
  transition: opacity .35s ease, transform .35s ease, max-height .4s ease, padding .35s ease, margin .35s ease;
  overflow: hidden;
}
.form-wrap.collapsed {
  opacity: 0;
  transform: translateY(-10px);
  max-height: 0;
  padding: 0 22px;
  margin: 0;
  pointer-events: none;
  border-color: transparent;
}

.form-title {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  letter-spacing: -.01em;
  font-size: 18px;
  text-transform: uppercase;
  color: var(--ink);
  margin: 0 0 14px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.grid .full { grid-column: 1 / -1; }

label {
  display: block;
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin: 0 0 6px 2px;
  font-weight: 600;
}

input, select {
  width: 100%;
  background: rgba(5,6,10,.55);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  font: 600 14px/1.2 'Montserrat', sans-serif;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus {
  border-color: var(--gold-1);
  box-shadow: 0 0 0 3px rgba(248,225,153,.25);
}
select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
  background-position: calc(100% - 18px) 18px, calc(100% - 13px) 18px;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}

.emoji-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.emoji-row button {
  flex: 1 1 auto;
  min-width: 48px;
  aspect-ratio: 1 / 1;
  font-size: 22px;
  background: rgba(5,6,10,.55);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 12px;
  cursor: pointer;
  transition: transform .15s, border-color .2s, background .2s;
}
.emoji-row button:hover { transform: translateY(-1px); }
.emoji-row button.active {
  border-color: var(--gold-1);
  background: rgba(255,255,255,.04);
  box-shadow: 0 0 0 3px rgba(248,225,153,.25);
}

.photo-input {
  display: flex;
  align-items: center;
  gap: 12px;
}
.photo-input .preview {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 1px dashed var(--line);
  background: rgba(5,6,10,.55) center/cover no-repeat;
  flex-shrink: 0;
}
.photo-input label.file-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-dim);
  background: rgba(5,6,10,.4);
  margin: 0;
  font-weight: 600;
}
.photo-input input[type="file"] { display: none; }

.actions {
  margin-top: 16px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  position: relative;
  border: none;
  cursor: pointer;
  padding: 14px 18px;
  border-radius: 12px;
  font: 800 12px/1 'Montserrat', sans-serif;
  letter-spacing: .08em;
  text-transform: uppercase;
  transition: transform .15s ease, box-shadow .25s ease;
  color: #1a0f00;
  background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 100%);
  box-shadow: 0 10px 30px rgba(196,142,43,.35), inset 0 1px 0 rgba(255,255,255,.5);
  flex: 1;
  min-width: 160px;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn.ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  box-shadow: none;
}
.btn.ghost:hover { border-color: var(--gold-1); color: var(--gold-1); }

/* =========================================================
   Stage & Card · VERSIÓN COMPARTIBLE (ratio 9:16)
   ========================================================= */
.stage {
  width: var(--card-w);
  height: var(--card-h);
  position: relative;
}

/* Stage oculto hasta que el usuario pulse Generar */
.stage.hidden {
  display: none;
}

/* Animación de revelación al generar la carta */
@keyframes card-reveal {
  0% {
    opacity: 0;
    transform: scale(0.7) rotateY(90deg);
    filter: blur(20px);
  }
  40% {
    opacity: 1;
    filter: blur(0);
  }
  60% {
    transform: scale(1.05) rotateY(0deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotateY(0deg);
    filter: blur(0);
  }
}
.stage.revealing {
  perspective: 1200px;
}
.stage.revealing .card {
  animation: card-reveal 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.card {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 22px;

  /* Borde exterior del color del tipo */
  background: linear-gradient(180deg, var(--type) 0%, var(--type-dark) 100%);
  padding: 12px;
  box-shadow:
    0 30px 80px rgba(0,0,0,.6),
    0 0 80px var(--type-soft),
    0 0 0 1px rgba(255,255,255,.06);
  overflow: hidden;
}

/* Borde dorado girando (efecto TCG premium) */
.card::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 20px;
  padding: 2px;
  background: conic-gradient(
    from 0deg,
    var(--gold-1) 0deg,
    transparent 80deg,
    var(--gold-2) 180deg,
    transparent 260deg,
    var(--gold-1) 360deg
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  animation: spin 8s linear infinite;
  opacity: .9;
  pointer-events: none;
  z-index: 3;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Marco dorado interior */
.card-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 35%, var(--gold-3) 65%, var(--gold-2) 85%, var(--gold-1) 100%);
  padding: 5px;
  box-shadow: inset 0 0 8px rgba(0,0,0,.4);
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 8px;
  background: linear-gradient(180deg, #f5e9c8 0%, #e8d49b 100%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Rayas foil muy sutiles */
.card .foil-lines {
  position: absolute; inset: 0;
  border-radius: 22px;
  pointer-events: none;
  z-index: 8;
  background: repeating-linear-gradient(
    115deg,
    rgba(255,255,255,.03) 0 2px,
    transparent 2px 6px
  );
  mix-blend-mode: screen;
}

/* Capa HOLOGRÁFICA estática (sigue ahí, sin tilt) */
.card .holo {
  position: absolute;
  inset: 0;
  border-radius: 22px;
  pointer-events: none;
  z-index: 9;
  mix-blend-mode: color-dodge;
  opacity: .5;
  background:
    linear-gradient(
      115deg,
      transparent 0%,
      rgba(255, 0, 122, .55) 20%,
      rgba(0, 224, 255, .55) 40%,
      rgba(255, 255, 255, .7) 50%,
      rgba(177, 75, 255, .55) 60%,
      rgba(255, 176, 32, .55) 80%,
      transparent 100%
    );
  background-size: 200% 200%;
  background-position: 50% 50%;
  filter: blur(1px);
  /* Animación lenta del holo para que "viva" sin depender del giroscopio */
  animation: holo-shift 10s ease-in-out infinite alternate;
}
@keyframes holo-shift {
  0%   { background-position: 20% 30%; }
  100% { background-position: 80% 70%; }
}

/* =========================================================
   CONTENIDO · Nueva jerarquía de impacto
   ========================================================= */

/* HEADER: Nombre + HP (HP GIGANTE) */
.tcg-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px 6px;
  background: linear-gradient(180deg, rgba(255,255,255,.35), transparent);
}
.tcg-name {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: -.02em;
  color: #1a0f00;
  text-shadow: 0 1px 0 rgba(255,255,255,.4);
  line-height: 1;
  text-transform: uppercase;
  max-width: 58%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding-top: 6px;
}
.tcg-hp {
  display: flex;
  align-items: baseline;
  gap: 6px;
  color: #c00e0e;
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  line-height: 1;
}
.tcg-hp .lbl {
  font-size: 13px;
  letter-spacing: .08em;
  transform: translateY(-6px);
}
.tcg-hp .val {
  font-size: 40px;
  text-shadow: 0 1px 0 rgba(255,255,255,.5), 0 3px 6px rgba(192,14,14,.3);
}

/* SUBHEADER: tipo/deporte */
.tcg-subheader {
  padding: 0 14px 6px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: #4a3a1a;
}

/* ILUSTRACIÓN: Foto central más grande */
.tcg-illustration {
  position: relative;
  margin: 0 12px;
  aspect-ratio: 1 / 1;
  border: 3px solid var(--gold-2);
  border-radius: 3px;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(255,255,255,.3) 0%, transparent 20%),
    linear-gradient(135deg, #b8d4e8 0%, #e8c4a0 100%);
  box-shadow:
    inset 0 0 0 1px var(--gold-1),
    inset 0 0 20px rgba(0,0,0,.3),
    0 2px 6px rgba(0,0,0,.2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.tcg-illustration .photo {
  width: 100%;
  height: 100%;
  background: center/cover no-repeat;
}
.tcg-illustration .placeholder {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  font-size: 84px;
  color: rgba(0,0,0,.3);
  text-shadow: 0 2px 0 rgba(255,255,255,.3);
}
.type-badge {
  position: absolute;
  top: 8px; right: 8px;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--type);
  border: 2px solid var(--gold-1);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 4px rgba(0,0,0,.25);
}
.type-badge svg { width: 20px; height: 20px; fill: #fff; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }

/* DESCRIPCIÓN corta bajo la ilustración */
.tcg-desc {
  padding: 8px 14px 6px;
  font-size: 11px;
  font-weight: 500;
  color: #4a3a1a;
  border-bottom: 1px solid rgba(0,0,0,.15);
  letter-spacing: .02em;
  text-align: center;
}

/* SECCIÓN ATAQUE — DAÑO GIGANTE */
.tcg-attack {
  padding: 12px 16px 8px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
}
.attack-cost {
  flex-shrink: 0;
}
.energy {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--type);
  border: 2px solid #1a0f00;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 3px rgba(0,0,0,.25);
}
.energy svg { width: 15px; height: 15px; fill: #fff; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }

.attack-body {
  flex: 1;
  min-width: 0;
}
.attack-name {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  font-size: 18px;
  color: #1a0f00;
  text-transform: uppercase;
  letter-spacing: -.01em;
  line-height: 1;
  margin-bottom: 4px;
}
.attack-flavor {
  font-size: 11px;
  color: #4a3a1a;
  line-height: 1.3;
  font-style: italic;
  font-weight: 500;
}
.attack-damage {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 44px;
  color: #1a0f00;
  line-height: 1;
  flex-shrink: 0;
  text-shadow: 1px 2px 0 rgba(255,255,255,.4), 0 4px 10px rgba(0,0,0,.15);
  padding-right: 2px;
}

/* =========================================================
   ACHIEVEMENT BADGE (la pieza que grita "compárteme")
   ========================================================= */
.achievement {
  margin: 4px 14px 8px;
  padding: 10px 14px;
  border-radius: 8px;
  background: linear-gradient(135deg, #1a0f00 0%, #3a2410 100%);
  border: 1px solid var(--gold-2);
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 12px rgba(0,0,0,.25), inset 0 1px 0 var(--gold-1);
  position: relative;
  overflow: hidden;
}
.achievement::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(248,225,153,.2) 50%, transparent 70%);
  background-size: 250% 100%;
  animation: shimmer 4s linear infinite;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -100% 0; }
}
.achievement svg {
  width: 22px; height: 22px;
  fill: var(--gold-1);
  flex-shrink: 0;
  filter: drop-shadow(0 0 8px var(--gold-1));
  position: relative;
}
.achievement .ach-text {
  position: relative;
  flex: 1;
  min-width: 0;
}
.achievement .ach-label {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  font-size: 13px;
  color: var(--gold-1);
  letter-spacing: .1em;
  text-transform: uppercase;
  line-height: 1;
  text-shadow: 0 0 10px rgba(248,225,153,.5);
}
.achievement .ach-sub {
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 10px;
  color: #c9b57d;
  letter-spacing: .05em;
  margin-top: 3px;
  line-height: 1;
}

/* =========================================================
   FOOTER con firma de marca
   ========================================================= */
.tcg-footer {
  margin-top: auto;
  padding: 10px 14px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: #4a3a1a;
  font-weight: 600;
  border-top: 1px solid rgba(0,0,0,.12);
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.04));
}
.tcg-footer .brand-sig {
  font-weight: 900;
  color: #1a0f00;
  letter-spacing: -.01em;
  text-transform: uppercase;
  font-size: 11px;
}
.tcg-footer .brand-sig span {
  color: var(--type-dark);
}

/* Partículas legendarias */
.particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 11;
  display: none;
  overflow: hidden;
  border-radius: 22px;
}
.card[data-rarity="legendary"] .particles { display: block; }
.particles i {
  position: absolute;
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--gold-1);
  box-shadow: 0 0 8px var(--gold-1);
  opacity: 0;
  animation: rise linear infinite;
}
@keyframes rise {
  0%   { transform: translateY(100%) scale(.6); opacity: 0; }
  20%  { opacity: 1; }
  100% { transform: translateY(-20%) scale(1); opacity: 0; }
}

/* =========================================================
   Toolbar
   ========================================================= */
.toolbar {
  display: flex;
  gap: 10px;
  width: var(--card-w);
  flex-wrap: wrap;
}
.toolbar.hidden { display: none; }
.toolbar .btn { flex: 1 1 140px; }

.btn.viral {
  background: linear-gradient(135deg, #ffb020, #ff3d7f 60%, #b14bff);
  color: #000;
  box-shadow: 0 10px 40px rgba(255,61,127,.4), inset 0 1px 0 rgba(255,255,255,.5);
}
.btn.viral::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 12px;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.6) 50%, transparent 70%);
  background-size: 250% 100%;
  mix-blend-mode: overlay;
  animation: shine 3.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes shine {
  0% { background-position: 200% 0; }
  100% { background-position: -100% 0; }
}

.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translate(-50%, 60px);
  background: rgba(10,12,20,.9);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 13px;
  backdrop-filter: blur(14px);
  box-shadow: 0 20px 40px rgba(0,0,0,.5);
  opacity: 0;
  transition: transform .3s ease, opacity .3s ease;
  z-index: 50;
  max-width: 90vw;
  text-align: center;
}

function svgIcon(path) {
  return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="${path}"/></svg>`;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/* =========================================================
   Stats engine · rareza + damage + HP
   ========================================================= */
function computeStats(metric, unit, timeStr) {
  const m = parseFloat(metric) || 0;

  const thresholds = {
    km:   [5, 10, 21, 42],
    kg:   [40, 100, 180, 250],
    reps: [20, 60, 120, 200],
    m:    [100, 500, 1500, 3000],
    min:  [15, 45, 90, 180]
  };

  const t = thresholds[unit] || thresholds.km;
  let rarity = 'common';
  if (m >= t[3])      rarity = 'legendary';
  else if (m >= t[2]) rarity = 'epic';
  else if (m >= t[1]) rarity = 'elite';
  else                rarity = 'common';

  const topRef = t[3] * 1.25;
  let raw = Math.sqrt(Math.min(m, topRef) / topRef) * 150;
  if (timeStr && timeStr.trim()) raw += 10;
  let damage = Math.round(raw / 10) * 10;
  damage = Math.max(10, Math.min(150, damage));

  let hp = Math.round((damage * 1.6 + 50) / 10) * 10;
  hp = Math.max(60, Math.min(240, hp));

  return { rarity, damage, hp };
}

/* Achievement copy para cada rareza (la parte que grita "compárteme") */
const ACHIEVEMENT = {
  common:    { label: 'NEW RECORD',        sub: 'Tu racha empieza aquí' },
  elite:     { label: 'ELITE UNLOCKED',    sub: 'Top 30% de atletas como tú' },
  epic:      { label: 'EPIC PERFORMANCE',  sub: 'Top 10% · menos de 1 entre 10' },
  legendary: { label: 'LEGENDARY STATUS',  sub: 'Top 1% · hoy eres historia' }
};

/* =========================================================
   Render
   ========================================================= */
function renderCard() {
  const { rarity, damage, hp } = computeStats(state.metric, state.unit, state.time);
  const sport = SPORT_DATA[state.sport] || SPORT_DATA['Running'];
  const attack = pickRandom(sport.attacks);  // ← aleatorio en cada render

  const root = document.documentElement.style;
  root.setProperty('--type', sport.type);
  root.setProperty('--type-dark', sport.typeDark);
  root.setProperty('--type-soft', sport.type + '73');

  $('#c-name').textContent   = (state.name || 'Tu Nombre');
  $('#c-hp').textContent     = hp;
  $('#c-subheader').textContent = `${sport.typeLabel} · ${state.sport}`;
  $('#c-typebadge').innerHTML = svgIcon(sport.icon);
  $('#c-cost').innerHTML      = `<div class="energy">${svgIcon(sport.icon)}</div>`;
  $('#c-attack').textContent = attack.name;
  $('#c-flavor').textContent = attack.flavor;
  $('#c-damage').textContent = damage;

  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const fecha = `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)}`;
  const metricTxt = state.metric ? `${formatNum(state.metric)} ${state.unit}` : '—';
  const timeTxt = state.time.trim() ? ` · ${state.time.trim()}` : '';
  $('#c-desc').textContent = `${metricTxt}${timeTxt} · ${fecha}`;

  // Achievement badge (pieza compartible)
  const ach = ACHIEVEMENT[rarity];
  $('#c-ach-label').textContent = ach.label;
  $('#c-ach-sub').textContent   = ach.sub;

  $('#hero-card').dataset.rarity = rarity;

  const sportCode = state.sport.substring(0, 3).toUpperCase();
  $('#c-id').textContent = `N.º ${sportCode}-${String(damage).padStart(3, '0')} ${state.emoji}`;

  // Foto
  const photoEl = $('#c-photo');
  const placeholderEl = $('#c-placeholder');
  if (state.photo) {
    photoEl.style.backgroundImage = `url(${state.photo})`;
    photoEl.style.display = 'block';
    placeholderEl.style.display = 'none';
  } else {
    photoEl.style.backgroundImage = '';
    photoEl.style.display = 'none';
    placeholderEl.style.display = 'flex';
    placeholderEl.textContent = (state.name || '?').trim().charAt(0).toUpperCase() || '?';
  }

  renderParticles(rarity === 'legendary' ? 24 : 0);
}

function formatNum(n) {
  const num = parseFloat(n);
  if (isNaN(num)) return n;
  return (num % 1 === 0) ? String(num) : num.toFixed(2).replace(/\.?0+$/, '');
}

function renderParticles(count) {
  const box = $('#particles');
  box.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const p = document.createElement('i');
    p.style.left = `${Math.random() * 100}%`;
    p.style.bottom = `-10px`;
    const size = 2 + Math.random() * 3;
    p.style.width = p.style.height = `${size}px`;
    p.style.animationDelay = `${Math.random() * 6}s`;
    p.style.animationDuration = `${4 + Math.random() * 4}s`;
    box.appendChild(p);
  }
}

   Form handlers

    $$('#emojiRow button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.emoji = b.dataset.emoji;
  });
});

form.photo.addEventListener('change', (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    state.photo = reader.result;
    $('#photoPreview').style.backgroundImage = `url(${state.photo})`;
  };
  reader.readAsDataURL(file);
});

$('#btnGenerate').addEventListener('click', () => {
  readForm();
  if (!state.name)   { toast('Pon tu nombre para forjar la carta'); form.name.focus(); return; }
  if (!state.metric || parseFloat(state.metric) <= 0) { toast('Introduce una métrica válida'); form.metric.focus(); return; }
  if (!state.photo)  { toast('Sube una foto para la ilustración central'); return; }

  renderCard();

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ name: state.name, photo: state.photo }));
  } catch(e) {}

  // Revelar carta con animación + mostrar toolbar y hint
  const stage = $('#stage');
  stage.classList.remove('hidden');
  // Forzamos reflow para reiniciar la animación si se pulsa Generar varias veces
  stage.classList.remove('revealing');
  void stage.offsetWidth;
  stage.classList.add('revealing');

  $('#toolbar').classList.remove('hidden');
  $('#hint').classList.remove('hidden');

  $('#formWrap').classList.add('collapsed');

  // Scroll suave a la carta para enfocar la atención
  setTimeout(() => {
    stage.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
});

$('#btnClear').addEventListener('click', () => {
  form.name.value = '';
  form.metric.value = '';
  form.time.value = '';
  form.photo.value = '';
  state.photo = null;
  $('#photoPreview').style.backgroundImage = '';
  localStorage.removeItem(STORAGE_KEY);

  // Ocultar carta, toolbar y hint
  $('#stage').classList.add('hidden');
  $('#stage').classList.remove('revealing');
  $('#toolbar').classList.add('hidden');
  $('#hint').classList.add('hidden');

  toast('Reseteado');
});

$('#btnEdit').addEventListener('click', () => {
  $('#formWrap').classList.remove('collapsed');
  $('#formWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* =========================================================
   BOTÓN VIRAL · html2canvas + Web Share API
   ========================================================= */
const card = $('#hero-card');

$('#btnShare').addEventListener('click', async () => {
  const btn = $('#btnShare');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'Preparando…';

  try {
    card.classList.add('capturing');
    await new Promise(r => setTimeout(r, 80));

    const canvas = await html2canvas(card, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      logging: false,
      allowTaint: true
    });

    card.classList.remove('capturing');

    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png', 1));
    if (!blob) throw new Error('No se pudo generar la imagen');

    const filename = `herocard-${(state.name || 'hero').toLowerCase().replace(/\s+/g, '-')}.png`;
    const file = new File([blob], filename, { type: 'image/png' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      const sport = SPORT_DATA[state.sport] || SPORT_DATA['Running'];
      await navigator.share({
        files: [file],
        title: 'Mi HeroCard',
        text: `${state.name} · ${state.sport} · ${formatNum(state.metric)} ${state.unit} ${state.emoji}`
      });
      toast('Compartido ✓');
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast('Imagen descargada. ¡Súbela a Stories!');
    }
  } catch (err) {
    console.error(err);
    card.classList.remove('capturing');
    if (err && err.name !== 'AbortError') toast('No se pudo compartir. Intenta de nuevo.');
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

/* No hay render inicial: la carta solo aparece cuando el usuario pulsa Generar */
</script>
